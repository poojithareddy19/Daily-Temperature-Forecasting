[project]
name = "mlops-temperature-forecast"
version = "0.1.0"
requires-python = ">=3.11"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.black]
line-length = 100
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
