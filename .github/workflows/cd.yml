name: CD

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (GHCR rejects the capital
      # letters in this repository's name) and adds an immutable sha-<commit>
      # tag next to the mutable :latest tag, so any build can be rolled back to.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  # An image-backed Render service has no Git auto-deploy, so CD triggers the deploy itself
  # and then checks that the new commit is really the one serving traffic.
  deploy:
    # Render runs the GHCR image, so it must not redeploy before the new :latest is pushed.
    needs: build-and-push
    runs-on: ubuntu-latest
    # A newer merge supersedes this one; its job verifies the newer commit instead.
    concurrency:
      group: render-deploy
      cancel-in-progress: true
    env:
      SERVICE_URL: https://temperature-forecast-api-mejw.onrender.com
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set; relying on Render auto-deploy"
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
            echo "Deploy triggered"
          fi

      - name: Wait until /health reports this commit
        run: |
          deadline=$((SECONDS + 1500))  # free-tier builds take several minutes
          until curl -fsS --max-time 90 "$SERVICE_URL/health" | grep -q "\"git_sha\":\"$GITHUB_SHA\""; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$GITHUB_SHA was not live after 25 minutes"
              curl -sS --max-time 90 "$SERVICE_URL/health" || true
              exit 1
            fi
            sleep 30
          done
          echo "$GITHUB_SHA is live"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke test the live service
        run: |
          pip install requests==2.32.3
          python scripts/smoke_test.py "$SERVICE_URL" "$GITHUB_SHA"
